{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 border p-4 shadow-sm bg-light">
        <h3 class="text-center">
            Edit Student Profile
        </h3>
        <hr>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="full_name" class="form-control" value="{{student.name}}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">CGPA</label>
                <input type="number" step="0.01" name="cgpa" class="form-control" value="{{student.cgpa or ''}}"
                    required>

            </div>

            <div>
                <label class="form-label">Resume Link (Google Drive, GitHub, etc.)</label>
                <input type="text" name="resume_url" class="form-control" value="{{student.resume_url or ''}}">
                <div class="form-text">Please provide a valid URL to your resume.</div>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('main.student_dashboard')}}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
